# Every commit a pull request carries must be signed and verified by GitHub.
# Branch protection holds that rule at merge time; this reports it as a named
# check on every push, lists each offending commit, and fails closed when the
# commit list cannot be read in full.
name: Signed commits

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    # Every shipped lock passes OSV before any job here installs or builds a
    # dependency: an install or a build script runs a package's code.
    name: Audit lock files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: none

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit every shipped lock against OSV
        run: python3 scripts/audit_locks.py

  signed:
    name: Signed commits
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the check
        run: python3 scripts/test_check_signed_commits.py

      - name: Check every commit's signature
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_signed_commits.py --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA"

      - name: Check every commit of the queued pull request
        # The queue's own commit is GitHub's; the commits it squashes are the
        # pull request's, named by the queue branch.
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          python3 scripts/test_merge_group_pr.py
          PR="$(python3 scripts/merge_group_pr.py)"
          HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          python3 scripts/check_signed_commits.py --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA"
