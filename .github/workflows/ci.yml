name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show pip version
        run: python -m pip --version

      - name: Guard supply-chain invariants
        run: |
          python scripts/check_workflows.py
          bash scripts/check_rust_supply_chain.sh

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .

      - name: Type check runtime contract boundaries
        run: bash scripts/typecheck-boundaries.sh

      - name: Pre-commit (lint + format + hygiene)
        env:
          SKIP: no-commit-to-branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
            TO_REF="${{ github.event.pull_request.head.sha }}"
          else
            FROM_REF="${{ github.event.before }}"
            TO_REF="${{ github.sha }}"
          fi
          # Some event refs may not exist in shallow/partial clones.
          # If either commit is unavailable, fall back to all-files mode.
          if ! git cat-file -e "${FROM_REF}^{commit}" 2>/dev/null || ! git cat-file -e "${TO_REF}^{commit}" 2>/dev/null; then
            echo "Pre-commit refs unavailable in checkout (from=$FROM_REF to=$TO_REF); running all-files."
            pre-commit run --show-diff-on-failure --all-files
            exit $?
          fi
          if echo "$FROM_REF" | grep -Eq '^0+$'; then
            echo "Running pre-commit on all files (no valid base ref)"
            pre-commit run --show-diff-on-failure --all-files
          else
            echo "Running pre-commit from $FROM_REF to $TO_REF"
            pre-commit run --show-diff-on-failure --from-ref "$FROM_REF" --to-ref "$TO_REF"
          fi

      - name: Guard Capability Matrix Updated
        if: github.event_name == 'pull_request'
        env:
          GUARD_CAP_MATRIX_BYPASS_TEXT: ${{ github.event.pull_request.body || '' }}
        run: |
          FROM_REF="${{ github.event.pull_request.base.sha }}"
          TO_REF="${{ github.event.pull_request.head.sha }}"
          bash scripts/guard-capability-matrix.sh "$FROM_REF" "$TO_REF"

      - name: Guard Tier Escalation Invariants
        run: |
          pytest -v \
            tests/test_action_dispatcher.py::TestCapabilityTierGuard \
            tests/test_soundness_verification.py::test_tier_c_dispatch_upgrade \
            tests/test_soundness_verification.py::test_dispatcher_never_downgrades_tier

      - name: Guard Skill Capability Invariants
        run: |
          pytest -v \
            tests/test_skill_loader.py::TestValidation::test_missing_defaults_mapping_for_trigger_raises \
            tests/test_skill_loader.py::TestValidation::test_extra_defaults_key_without_trigger_raises

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=ori \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not hardware"

      - name: Audit pinned Python dependencies
        run: |
          python -m pip_audit -r requirements/runtime.txt
          python -m pip_audit -r requirements/dev.txt

      - name: Generate runtime SBOM
        if: matrix.python-version == '3.12'
        run: |
          python -m cyclonedx_py requirements requirements/runtime.txt \
            --pyproject pyproject.toml \
            --output-reproducible \
            --of JSON \
            -o sbom-runtime.json

      - name: Upload runtime SBOM
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-runtime
          path: sbom-runtime.json
          if-no-files-found: error

      - name: Validate bundled skills load cleanly
        run: |
          python -c "
          import asyncio, sys
          from ori.skills.loader import SkillLoader
          import pathlib

          skills_dir = pathlib.Path('skills')
          loader = SkillLoader()
          failed = []

          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir():
                  continue
              try:
                  skill = loader.load_one(skill_dir)
                  print(f'  ✅ {skill.name} v{skill.version} — {len(skill.triggers)} triggers')
              except Exception as exc:
                  print(f'  ❌ {skill_dir.name}: {exc}')
                  failed.append(skill_dir.name)

          if failed:
              print(f'Failed to load: {failed}')
              sys.exit(1)
          print('All bundled skills loaded cleanly.')
          "

      - name: Release wheel smoke test
        if: matrix.python-version == '3.12'
        run: bash scripts/smoke-release-wheel.sh

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  evidence-artifact:
    name: Evidence FFI smoke (private artifact)
    # Dependabot pull requests cannot read repository secrets, so the private
    # artifact source and checkout token are intentionally unavailable there.
    # The Python matrix still validates dependency bumps; real artifact smoke
    # runs on main pushes and human-authored PRs.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate private evidence artifact source inputs
        env:
          ORI_EVIDENCE_ARTIFACT_REPOSITORY: ${{ secrets.ORI_EVIDENCE_ARTIFACT_REPOSITORY }}
          ORI_EVIDENCE_ARTIFACT_REF: ${{ secrets.ORI_EVIDENCE_ARTIFACT_REF }}
          ORI_EVIDENCE_ARTIFACT_TOKEN: ${{ secrets.ORI_EVIDENCE_ARTIFACT_TOKEN }}
          ORI_EVIDENCE_ARTIFACT_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_VERSION }}
          ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION }}
          ORI_EVIDENCE_ARTIFACT_MODULE: ${{ secrets.ORI_EVIDENCE_ARTIFACT_MODULE }}
          ORI_EVIDENCE_ARTIFACT_CLASS: ${{ secrets.ORI_EVIDENCE_ARTIFACT_CLASS }}
          ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH: ${{ secrets.ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH }}
          ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE: ${{ secrets.ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE }}
        run: |
          if [ -z "$ORI_EVIDENCE_ARTIFACT_REPOSITORY" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_REF" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_TOKEN" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_VERSION" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_MODULE" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_CLASS" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH" ] ||
             [ -z "$ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE" ]; then
            echo "private evidence artifact source secrets are not configured" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "private evidence artifact source ref must be a full commit SHA" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "private evidence artifact source version must be semver-like (x.y.z)" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
            echo "private evidence artifact protocol version has an invalid shape" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_MODULE" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'; then
            echo "private evidence artifact module has an invalid shape" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_CLASS" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "private evidence artifact class has an invalid shape" >&2
            exit 1
          fi
          if printf '%s' "$ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH" | grep -Eq '(^/|(^|/)\.\.(/|$))' ||
             ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH" | grep -Eq 'Cargo\.toml$'; then
            echo "private evidence artifact manifest path has an invalid shape" >&2
            exit 1
          fi
          if ! printf '%s' "$ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
            echo "private evidence artifact chain table has an invalid shape" >&2
            exit 1
          fi

      - name: Checkout pinned evidence artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.ORI_EVIDENCE_ARTIFACT_REPOSITORY }}
          ref: ${{ secrets.ORI_EVIDENCE_ARTIFACT_REF }}
          token: ${{ secrets.ORI_EVIDENCE_ARTIFACT_TOKEN }}
          path: .evidence-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        working-directory: .evidence-src
        run: rustup toolchain install

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --require-hashes --no-deps -r requirements/evidence-artifact-ci.txt
          python -m pip install --no-deps -e .

      - name: Build private evidence artifact wheel from the pinned ref
        working-directory: .evidence-src
        env:
          ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH: ${{ secrets.ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH }}
        run: |
          maturin build --release --features python \
            --manifest-path "$ORI_EVIDENCE_ARTIFACT_MANIFEST_PATH" \
            --out ../evidence-wheel

      - name: Install built wheel and verify artifact identity
        env:
          ORI_EVIDENCE_ARTIFACT_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_VERSION }}
          ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION }}
          ORI_EVIDENCE_ARTIFACT_MODULE: ${{ secrets.ORI_EVIDENCE_ARTIFACT_MODULE }}
        run: |
          python -m pip install --no-deps evidence-wheel/*.whl
          python - <<'EOF'
          import importlib
          import os
          artifact = importlib.import_module(os.environ["ORI_EVIDENCE_ARTIFACT_MODULE"])
          expected = os.environ["ORI_EVIDENCE_ARTIFACT_VERSION"]
          expected_protocol = os.environ["ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION"]
          assert artifact.ARTIFACT_VERSION == expected, (
              f"built artifact {artifact.ARTIFACT_VERSION!r} != expected {expected!r}"
          )
          assert artifact.PROTOCOL_VERSION == expected_protocol, (
              f"built protocol {artifact.PROTOCOL_VERSION!r} "
              f"!= expected {expected_protocol!r}"
          )
          print(
              f"private evidence artifact {artifact.ARTIFACT_VERSION} "
              f"(protocol {artifact.PROTOCOL_VERSION}) OK"
          )
          EOF

      - name: Run real-artifact FFI smoke tests
        env:
          ORI_EVIDENCE_ARTIFACT_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_VERSION }}
          ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION: ${{ secrets.ORI_EVIDENCE_ARTIFACT_PROTOCOL_VERSION }}
          ORI_EVIDENCE_ARTIFACT_MODULE: ${{ secrets.ORI_EVIDENCE_ARTIFACT_MODULE }}
          ORI_EVIDENCE_ARTIFACT_CLASS: ${{ secrets.ORI_EVIDENCE_ARTIFACT_CLASS }}
          ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE: ${{ secrets.ORI_EVIDENCE_ARTIFACT_CHAIN_TABLE }}
        run: pytest tests/test_evidence_artifact.py -v
