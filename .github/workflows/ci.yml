name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show pip version
        run: python -m pip --version

      - name: Guard supply-chain invariants
        run: |
          python scripts/check_workflows.py
          bash scripts/check_rust_supply_chain.sh

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .

      - name: Type check runtime contract boundaries
        run: bash scripts/typecheck-boundaries.sh

      - name: Pre-commit (lint + format + hygiene)
        env:
          SKIP: no-commit-to-branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
            TO_REF="${{ github.event.pull_request.head.sha }}"
          else
            FROM_REF="${{ github.event.before }}"
            TO_REF="${{ github.sha }}"
          fi
          # Some event refs may not exist in shallow/partial clones.
          # If either commit is unavailable, fall back to all-files mode.
          if ! git cat-file -e "${FROM_REF}^{commit}" 2>/dev/null || ! git cat-file -e "${TO_REF}^{commit}" 2>/dev/null; then
            echo "Pre-commit refs unavailable in checkout (from=$FROM_REF to=$TO_REF); running all-files."
            pre-commit run --show-diff-on-failure --all-files
            exit $?
          fi
          if echo "$FROM_REF" | grep -Eq '^0+$'; then
            echo "Running pre-commit on all files (no valid base ref)"
            pre-commit run --show-diff-on-failure --all-files
          else
            echo "Running pre-commit from $FROM_REF to $TO_REF"
            pre-commit run --show-diff-on-failure --from-ref "$FROM_REF" --to-ref "$TO_REF"
          fi

      - name: Guard Capability Matrix Updated
        if: github.event_name == 'pull_request'
        env:
          GUARD_CAP_MATRIX_BYPASS_TEXT: ${{ github.event.pull_request.body || '' }}
        run: |
          FROM_REF="${{ github.event.pull_request.base.sha }}"
          TO_REF="${{ github.event.pull_request.head.sha }}"
          bash scripts/guard-capability-matrix.sh "$FROM_REF" "$TO_REF"

      - name: Guard Tier Escalation Invariants
        run: |
          pytest -v \
            tests/test_action_dispatcher.py::TestCapabilityTierGuard \
            tests/test_soundness_verification.py::test_tier_c_dispatch_upgrade \
            tests/test_soundness_verification.py::test_dispatcher_never_downgrades_tier

      - name: Guard Skill Capability Invariants
        run: |
          pytest -v \
            tests/test_skill_loader.py::TestValidation::test_missing_defaults_mapping_for_trigger_raises \
            tests/test_skill_loader.py::TestValidation::test_extra_defaults_key_without_trigger_raises

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=ori \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not hardware"

      - name: Audit pinned Python dependencies
        run: |
          python -m pip_audit -r requirements/runtime.txt
          python -m pip_audit -r requirements/dev.txt

      - name: Generate runtime SBOM
        if: matrix.python-version == '3.12'
        run: |
          python -m cyclonedx_py requirements requirements/runtime.txt \
            --pyproject pyproject.toml \
            --output-reproducible \
            --of JSON \
            -o sbom-runtime.json

      - name: Upload runtime SBOM
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-runtime
          path: sbom-runtime.json
          if-no-files-found: error

      - name: Validate bundled skills load cleanly
        run: |
          python -c "
          import asyncio, sys
          from ori.skills.loader import SkillLoader
          import pathlib

          skills_dir = pathlib.Path('skills')
          loader = SkillLoader()
          failed = []

          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir():
                  continue
              try:
                  skill = loader.load_one(skill_dir)
                  print(f'  ✅ {skill.name} v{skill.version} — {len(skill.triggers)} triggers')
              except Exception as exc:
                  print(f'  ❌ {skill_dir.name}: {exc}')
                  failed.append(skill_dir.name)

          if failed:
              print(f'Failed to load: {failed}')
              sys.exit(1)
          print('All bundled skills loaded cleanly.')
          "

      - name: Release wheel smoke test
        if: matrix.python-version == '3.12'
        run: bash scripts/smoke-release-wheel.sh

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  evidence-artifact:
    name: Evidence FFI smoke (real ori_verity)
    # Dependabot pull requests cannot read repository secrets, so the private
    # ori-verity checkout token is intentionally unavailable there. The Python
    # matrix still validates dependency bumps; real artifact smoke runs on main
    # pushes and human-authored PRs.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read verity artifact pin
        id: pin
        run: |
          repo="$(grep '^repo=' verity-artifact.pin | cut -d= -f2)"
          ref="$(grep '^ref=' verity-artifact.pin | cut -d= -f2)"
          version="$(grep '^expected_artifact_version=' verity-artifact.pin | cut -d= -f2)"
          if [ -z "$repo" ] || [ -z "$ref" ] || [ -z "$version" ]; then
            echo "verity-artifact.pin is missing repo/ref/expected_artifact_version" >&2
            exit 1
          fi
          if ! echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "verity-artifact.pin ref must be a full commit SHA, got: $ref" >&2
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned ori-verity source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.ORI_VERITY_CI_TOKEN }}
          path: .verity-src
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain (from verity rust-toolchain.toml)
        working-directory: .verity-src
        run: rustup toolchain install

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --require-hashes --no-deps -r requirements/verity-ci.txt
          python -m pip install --no-deps -e .

      - name: Build ori_verity wheel from the pinned ref
        working-directory: .verity-src
        run: |
          maturin build --release --features python \
            --manifest-path ori-verity/Cargo.toml \
            --out ../verity-wheel

      - name: Install built wheel and verify artifact identity
        run: |
          python -m pip install --no-deps verity-wheel/*.whl
          python - <<'EOF'
          import ori_verity
          expected = "${{ steps.pin.outputs.version }}"
          assert ori_verity.ARTIFACT_VERSION == expected, (
              f"built artifact {ori_verity.ARTIFACT_VERSION!r} != pinned {expected!r}"
          )
          print(
              f"ori_verity {ori_verity.ARTIFACT_VERSION} "
              f"(protocol {ori_verity.PROTOCOL_VERSION}) OK"
          )
          EOF

      - name: Run real-artifact FFI smoke tests
        run: pytest tests/test_evidence_artifact.py -v
