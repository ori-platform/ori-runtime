name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show pip version
        run: python -m pip --version

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .

      - name: Guard supply-chain invariants
        run: |
          python scripts/check_workflows.py
          bash scripts/check_rust_supply_chain.sh

      # Vendored contract vectors are hermetic, which is why the suite works
      # offline — and also how they could go stale invisibly. This notices.
      # The provenance rule decides when a consumer must re-vendor, so a defect
      # in it costs either false failures on every unrelated specs merge or a
      # pin naming a commit nobody can find. It runs against throwaway git
      # fixtures and needs no network.
      - name: Test the vendored-vector provenance rule
        if: matrix.python-version == '3.12'
        run: bash scripts/test-refresh-evidence-vectors.sh

      - name: Check vendored evidence vectors against ori-specs
        if: matrix.python-version == '3.12'
        run: bash scripts/refresh-evidence-vectors.sh

      # The wheelhouse audit runs only under the release marker, so defects in
      # it reach tags before any branch can see them: v2.5.0-rc.1 and rc.2 were
      # both spent that way. It needs a built wheelhouse rather than a secret,
      # so it can run here on a synthetic term.
      #
      # The Pi target is audited rather than the generic one because it is a
      # superset: the same runtime lock plus the Raspberry Pi hardware wheels
      # that aarch64 bundles now ship. Auditing the smaller target would leave
      # the wheels that actually reach a device uninspected.
      - name: Audit a built wheelhouse for disclosure
        if: matrix.python-version == '3.12'
        env:
          ORI_WHEELHOUSE_OUT: ${{ runner.temp }}/wheelhouse
          ORI_WHEELHOUSE_TARGET: pi
        run: |
          set -euo pipefail
          bash scripts/build-wheelhouse.sh
          # The real identifiers stay in the release environment. A synthetic
          # term proves the machinery rather than the secret.
          term="orisyntheticdisclosureprobe"
          ORI_DISCLOSURE_DENYLIST="${term}" python -m pytest \
            tests/evidence/test_disclosure.py -m disclosure_release -q
          # Silence is only evidence if the audit would have spoken. Plant the
          # term in a shipped wheel and require a refusal, so a wheelhouse that
          # is never really read cannot report itself clean.
          probe="${RUNNER_TEMP}/wheelhouse-probe"
          rm -rf "${probe}"
          cp -r "${ORI_WHEELHOUSE_OUT}" "${probe}"
          printf 'LEAKED = "%s"\n' "${term}" > "${RUNNER_TEMP}/probe_leak.py"
          (cd "${RUNNER_TEMP}" && zip -q "$(ls "${probe}"/*.whl | head -1)" probe_leak.py)
          if ORI_WHEELHOUSE_OUT="${probe}" ORI_DISCLOSURE_DENYLIST="${term}" \
             python -m pytest tests/evidence/test_disclosure.py \
             -m disclosure_release -q >/dev/null 2>&1; then
            echo "the audit accepted a wheelhouse carrying the probe term" >&2
            exit 1
          fi
          rm -rf "${probe}" "${RUNNER_TEMP}/probe_leak.py"

      # The bundle build is the last release-only step with no branch
      # equivalent, and v2.5.0-rc.4 was spent proving it: the Pi wheelhouse is
      # the first release target to carry setuptools, whose wheel vendors
      # twelve dist-info directories, and the builder called it ambiguous. The
      # wheelhouse above is reused rather than rebuilt.
      - name: Assemble a release bundle from that wheelhouse
        if: matrix.python-version == '3.12'
        env:
          ORI_WHEELHOUSE_OUT: ${{ runner.temp }}/wheelhouse
        run: |
          set -euo pipefail
          # The bundle refuses a target whose Python does not match the build
          # interpreter, so the target is derived here rather than written out.
          target="$(python -c "
          import platform, sys
          arch = {'x86_64': 'x86_64', 'amd64': 'x86_64', 'aarch64': 'aarch64', 'arm64': 'aarch64'}[platform.machine()]
          sys.stdout.write(f'linux-{arch}-python{sys.version_info.major}.{sys.version_info.minor}')
          ")"
          # The bundle names its version in SemVer and the wheel in PEP 440.
          # check_release_identity.py is the authority on that pairing, so the
          # tag derived here is handed to it rather than trusted.
          tag="$(python -c "
          import pathlib, re, sys
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          found = re.search(r'^version = \"([^\"]+)\"', text, re.M)
          if not found:
              sys.exit('pyproject declares no version')
          packaged = found.group(1)
          parts = re.fullmatch(r'(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?', packaged)
          if not parts:
              sys.exit(f'unrecognised packaged version: {packaged}')
          base, kind, number = parts.groups()
          sys.stdout.write('v' + (base if kind is None else f'{base}-{kind}.{number}'))
          ")"
          version="$(python scripts/check_release_identity.py --tag "${tag}" | cut -d= -f2)"
          echo "Assembling ${version} for ${target}"
          python scripts/build_release_bundle.py \
            --wheelhouse "${ORI_WHEELHOUSE_OUT}" \
            --runtime-version "${version}" \
            --target "${target}" \
            --config-template ori.linux.yaml.example \
            --service-template packaging/systemd/ori-runtime.service.in \
            --output-dir "${RUNNER_TEMP}/bundle"
          ls -l "${RUNNER_TEMP}/bundle"

      - name: Type check runtime contract boundaries
        run: bash scripts/typecheck-boundaries.sh

      # Whole-package mypy runs here rather than in pre-commit because this job
      # installs requirements/dev.txt with --require-hashes. Several optional
      # dependencies change which `type: ignore` comments are needed, so the
      # result is only reproducible in a pinned environment; a developer's local
      # set is not one. That is a reason to scope the check, not to skip it.
      - name: Type check the whole package
        run: python -m mypy ori/

      # Pyright catches what mypy does not: unbound locals behind optional
      # imports, attributes missing from a None-typed handle, and async context
      # managers entered synchronously. Scoped to `ori/` because the test tree
      # still carries stub-typing diagnostics; widening it is #358's remaining
      # half. A ratchet only holds if the clean half is enforced.
      - name: Type check production code (pyright)
        if: matrix.python-version == '3.12'
        run: pyright ori/

      - name: Pre-commit (lint + format + hygiene)
        env:
          SKIP: no-commit-to-branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
            TO_REF="${{ github.event.pull_request.head.sha }}"
          else
            FROM_REF="${{ github.event.before }}"
            TO_REF="${{ github.sha }}"
          fi
          # Some event refs may not exist in shallow/partial clones.
          # If either commit is unavailable, fall back to all-files mode.
          if ! git cat-file -e "${FROM_REF}^{commit}" 2>/dev/null || ! git cat-file -e "${TO_REF}^{commit}" 2>/dev/null; then
            echo "Pre-commit refs unavailable in checkout (from=$FROM_REF to=$TO_REF); running all-files."
            pre-commit run --show-diff-on-failure --all-files
            exit $?
          fi
          if echo "$FROM_REF" | grep -Eq '^0+$'; then
            echo "Running pre-commit on all files (no valid base ref)"
            pre-commit run --show-diff-on-failure --all-files
          else
            echo "Running pre-commit from $FROM_REF to $TO_REF"
            pre-commit run --show-diff-on-failure --from-ref "$FROM_REF" --to-ref "$TO_REF"
          fi

      - name: Guard Capability Matrix Updated
        if: github.event_name == 'pull_request'
        env:
          GUARD_CAP_MATRIX_BYPASS_TEXT: ${{ github.event.pull_request.body || '' }}
        run: |
          FROM_REF="${{ github.event.pull_request.base.sha }}"
          TO_REF="${{ github.event.pull_request.head.sha }}"
          bash scripts/guard-capability-matrix.sh "$FROM_REF" "$TO_REF"

      - name: Guard Tier Escalation Invariants
        run: |
          pytest -v \
            tests/test_action_dispatcher.py::TestCapabilityTierGuard \
            tests/test_soundness_verification.py::test_tier_c_dispatch_upgrade \
            tests/test_soundness_verification.py::test_dispatcher_never_downgrades_tier

      - name: Guard Skill Capability Invariants
        run: |
          pytest -v \
            tests/test_skill_loader.py::TestValidation::test_missing_defaults_mapping_for_trigger_raises \
            tests/test_skill_loader.py::TestValidation::test_extra_defaults_key_without_trigger_raises

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=ori \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not hardware"

      # GitHub's runner normally starts at 0022. Debian private-user-group
      # hosts, including stock Raspberry Pi OS Trixie, commonly use 0002;
      # installer fixtures must not depend on the runner's ambient umask.
      - name: Installer checks under private-group umask
        run: |
          umask 0002
          pytest -q \
            tests/test_linux_installer.py \
            tests/test_installer_activation.py

      # System scope is only meaningful as root: the execution guard returns
      # immediately for any other account, so an unprivileged run of these
      # would pass without exercising anything. They assert `geteuid() == 0`
      # rather than skipping, so a missing privileged invocation fails here
      # instead of quietly reporting green.
      - name: System-scope installer checks (root, real venv)
        run: |
          sudo -H env ORI_REQUIRE_ROOT_TESTS=1 \
            "$(which python)" -m pytest \
            tests/test_installer_system_scope.py -q

      - name: Audit pinned Python dependencies
        run: |
          python -m pip_audit -r requirements/runtime.txt
          python -m pip_audit -r requirements/dev.txt

      - name: Generate runtime SBOM
        if: matrix.python-version == '3.12'
        run: |
          python -m cyclonedx_py requirements requirements/runtime.txt \
            --pyproject pyproject.toml \
            --output-reproducible \
            --of JSON \
            -o sbom-runtime.json

      - name: Upload runtime SBOM
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-runtime
          path: sbom-runtime.json
          if-no-files-found: error

      - name: Validate bundled skills load cleanly
        run: |
          python -c "
          import asyncio, sys
          from ori.skills.loader import SkillLoader
          import pathlib

          skills_dir = pathlib.Path('skills')
          loader = SkillLoader()
          failed = []

          for skill_dir in sorted(skills_dir.iterdir()):
              if not skill_dir.is_dir():
                  continue
              try:
                  skill = loader.load_one(skill_dir)
                  print(f'  ✅ {skill.name} v{skill.version} — {len(skill.triggers)} triggers')
              except Exception as exc:
                  print(f'  ❌ {skill_dir.name}: {exc}')
                  failed.append(skill_dir.name)

          if failed:
              print(f'Failed to load: {failed}')
              sys.exit(1)
          print('All bundled skills loaded cleanly.')
          "

      - name: Release wheel smoke test
        if: matrix.python-version == '3.12'
        run: bash scripts/smoke-release-wheel.sh

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
