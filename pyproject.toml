[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ori-runtime"
version = "2.1.0"
description = "Offline-first agentic IoT runtime — give physical devices the ability to reason"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ori Nexus Systems LTD", email = "wasiubakare@gmail.com" }
]
keywords = ["iot", "edge-ai", "agentic", "llm", "raspberry-pi", "offline-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = []
runtime = [
    "paho-mqtt>=2.0",
    "psutil>=5.9",
    "pyserial>=3.5",
    "pysolarmanv5>=3.0",
    "asyncua>=1.1",
    "aiofiles>=23.0",
    "aiohttp>=3.14.1",
    "httpx>=0.28",
    "cryptography>=48.0.1",
    "pyopenssl>=26.3.0",
    "twilio>=9.0",
    "africastalking>=1.0",
    "python-dotenv>=1.0",
    "urllib3>=2.7.0",
]
phone = [
    "pyserial>=3.5",
    "tzdata>=2025.2",
    "httpx>=0.28",
    "cryptography>=48.0.1",
    "twilio>=9.0",
    "africastalking>=1.0",
]
phone-growatt = [
    "pyserial>=3.5",
    "tzdata>=2025.2",
    "httpx>=0.28",
    "cryptography>=48.0.1",
    "twilio>=9.0",
    "africastalking>=1.0",
    "pysolarmanv5>=3.0",
]
phone-victron = [
    "pyserial>=3.5",
    "tzdata>=2025.2",
    "httpx>=0.28",
    "cryptography>=48.0.1",
    "twilio>=9.0",
    "africastalking>=1.0",
    "aiomqtt>=2.0",
]
pi = [
    "gpiozero>=2.0",
    "smbus2>=0.4",
    "RPi.GPIO>=0.7",
]
llm = [
    "llama-cpp-python>=0.2",
]
cloud = [
    "anthropic>=0.28",
]
all = [
    "paho-mqtt>=2.0",
    "psutil>=5.9",
    "pyserial>=3.5",
    "pysolarmanv5>=3.0",
    "asyncua>=1.1",
    "aiofiles>=23.0",
    "aiohttp>=3.14.1",
    "httpx>=0.28",
    "cryptography>=48.0.1",
    "pyopenssl>=26.3.0",
    "twilio>=9.0",
    "africastalking>=1.0",
    "python-dotenv>=1.0",
    "urllib3>=2.7.0",
    "gpiozero>=2.0",
    "smbus2>=0.4",
    "RPi.GPIO>=0.7",
    "llama-cpp-python>=0.2",
    "anthropic>=0.28",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
]

[project.scripts]
ori-runtime = "ori.runtime:main"
ori-config-install = "ori.config_installer:main"
ori-phone-doctor = "ori.phone_doctor:main"
ori-inverter-profile-doctor = "ori.inverter_profile_doctor:main"
ori-firmware-provisioner = "ori.firmware_provisioner:main"

[project.urls]
Homepage = "https://github.com/ori-platform/ori-runtime"
Repository = "https://github.com/ori-platform/ori-runtime"
Documentation = "https://github.com/ori-platform/ori-runtime#readme"
Issues = "https://github.com/ori-platform/ori-runtime/issues"


[tool.setuptools.data-files]
"share/ori-runtime/skills/battery-lifecycle-observer" = [
    "skills/battery-lifecycle-observer/skill.yaml",
    "skills/battery-lifecycle-observer/hooks.py",
]
"share/ori-runtime/skills/energy-anomaly-detector" = [
    "skills/energy-anomaly-detector/skill.yaml",
    "skills/energy-anomaly-detector/hooks.py",
]
"share/ori-runtime/skills/hvac-refrigerant-monitor" = [
    "skills/hvac-refrigerant-monitor/skill.yaml",
    "skills/hvac-refrigerant-monitor/hooks.py",
]
"share/ori-runtime/skills/pc-network-threat-monitor" = [
    "skills/pc-network-threat-monitor/skill.yaml",
    "skills/pc-network-threat-monitor/hooks.py",
]
"share/ori-runtime/skills/pc-system-health" = [
    "skills/pc-system-health/skill.yaml",
    "skills/pc-system-health/hooks.py",
]
"share/ori-runtime/skills/prosumer-energy-advisor" = [
    "skills/prosumer-energy-advisor/skill.yaml",
    "skills/prosumer-energy-advisor/hooks.py",
]
"share/ori-runtime/skills/retail-occupancy-optimizer" = [
    "skills/retail-occupancy-optimizer/skill.yaml",
    "skills/retail-occupancy-optimizer/hooks.py",
]
"share/ori-runtime/skills/site-safety-ppe" = [
    "skills/site-safety-ppe/skill.yaml",
    "skills/site-safety-ppe/hooks.py",
]
"share/ori-runtime/skills/solar-performance-monitor" = [
    "skills/solar-performance-monitor/skill.yaml",
    "skills/solar-performance-monitor/hooks.py",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ori*"]

[tool.setuptools.package-data]
ori = ["py.typed", "hal/inverter_profiles/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ori.gateway.*",
    "ori.integration.*",
    "ori.network.events",
    "ori.reasoning.rule_engine",
    "ori.skills.hooks_api",
    "ori.skills.loader",
    "ori.policy.*",
    "ori.reasoning.capability_posture",
    "ori.reasoning.escalation_policy",
    "ori.security.gateway_messages",
    "ori.security.remote_commands",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ori.hal.*",
    "ori.hardware.*",
    "ori.skills.sandbox",
    "ori.skills.os_sandbox",
    "tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
