name: prosumer-energy-advisor
version: 0.1.0
author: wasiubakare
license: Apache-2.0
signature: bundled

sensors_required:
  - type: usb_power
    protocol: usb_serial
  - type: power
    protocol: simulation
  - type: growatt_pv_power
    protocol: growatt
  - type: growatt_grid_power
    protocol: growatt
  - type: grid_available
    protocol: simulation
  - type: grid_voltage
    protocol: simulation
  - type: growatt_load_power
    protocol: growatt
  - type: growatt_battery_soc
    protocol: growatt
  - type: growatt_battery_power
    protocol: growatt
  - type: victron_pv_power
    protocol: victron
  - type: victron_grid_power
    protocol: victron
  - type: victron_battery_soc
    protocol: victron
  - type: victron_battery_power
    protocol: victron
  - type: deye_pv1_power
    protocol: solarman_modbus
  - type: deye_grid_power
    protocol: solarman_modbus
  - type: deye_load_power
    protocol: solarman_modbus
  - type: deye_battery_soc
    protocol: solarman_modbus
  - type: deye_battery_power
    protocol: solarman_modbus
  - type: generator_power
    protocol: simulation
  - type: diesel_generator_power
    protocol: simulation

triggers:
  - name: self_consume_or_store_surplus
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and config_valid == 1 and optimizer_action == 'consume_or_store'"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: export_cap_approaching
    condition: "is_grid_power_event == 1 and quality >= min_quality and config_valid == 1 and export_cap_configured == 1 and export_cap_exceeded == 0 and grid_export_watts >= export_cap_warning_watts"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: export_cap_exceeded
    condition: "is_grid_power_event == 1 and quality >= min_quality and config_valid == 1 and export_cap_configured == 1 and export_cap_exceeded == 1"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: export_surplus_with_headroom
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and config_valid == 1 and optimizer_action == 'export_now'"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: defer_deferrable_load
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and config_valid == 1 and optimizer_action == 'defer_load_preserve_reserve'"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: preserve_battery_reserve
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and config_valid == 1 and optimizer_action == 'preserve_battery_reserve'"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: reduce_generator_use
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and config_valid == 1 and optimizer_action == 'reduce_generator_use'"
    cooldown_seconds: 900
    escalate_to: local_slm
    action_tier: A

  - name: net_billing_compliance_attention
    condition: "is_prosumer_power_event == 1 and quality >= min_quality and net_billing_tracking_qualified == 1 and net_billing_attention_required == 1"
    cooldown_seconds: 21600
    escalate_to: local_slm
    action_tier: A

prompts:
  self_consume_or_store_surplus: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence for a business owner explaining that solar surplus
    is available and why using or storing it is usually better than exporting it
    at a lower credit.

  export_cap_approaching: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence explaining that export is near the configured
    regulatory/site cap and should be reviewed before exporting more.

  export_cap_exceeded: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence explaining that export is above the configured
    regulatory/site cap and the operator should use or store surplus on-site
    instead of adding more export.

  export_surplus_with_headroom: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence explaining that the battery has enough reserve,
    surplus power is available, and export can be considered within the
    configured cap.

  defer_deferrable_load: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence explaining that non-urgent loads should be delayed
    because grid draw is high while solar and battery reserve are low.

  preserve_battery_reserve: |
    Your job is advisory only. Do not command the inverter or imply that Ori
    changed any setting.
    Write one plain sentence explaining that battery reserve is low and the
    operator should protect backup energy for outages.

  reduce_generator_use: |
    Your job is advisory only. Do not command the generator or inverter or imply
    that Ori changed any setting.
    Write one plain sentence explaining that generator use may be reduced by
    using available solar or battery energy for non-urgent loads.

  net_billing_compliance_attention: |
    Your job is advisory only. Do not present Ori as the regulator, DisCo, NERC,
    NEMSA, or billing meter of record. Write one plain sentence explaining that
    the operator should review the supplied net-billing compliance records.

actions:
  available:
    - name: alert_whatsapp
      tier: A
    - name: log_to_dashboard
      tier: A
  defaults:
    self_consume_or_store_surplus: [alert_whatsapp, log_to_dashboard]
    export_cap_approaching: [alert_whatsapp, log_to_dashboard]
    export_cap_exceeded: [alert_whatsapp, log_to_dashboard]
    export_surplus_with_headroom: [alert_whatsapp, log_to_dashboard]
    defer_deferrable_load: [alert_whatsapp, log_to_dashboard]
    preserve_battery_reserve: [alert_whatsapp, log_to_dashboard]
    reduce_generator_use: [alert_whatsapp, log_to_dashboard]
    net_billing_compliance_attention: [alert_whatsapp, log_to_dashboard]

config:
  timezone: Africa/Lagos
  min_quality: 0.8

  # Versioned operational policy for Tier A advice only. DisCo revenue-grade
  # import/export statements remain the billing source of truth for regulated
  # net billing. Replace this profile with product-provisioning generated site policy.
  tariff_profile:
    profile: ng-operator-provided-example
    version: 2026-06-draft
    status: operator_provided
    country: NG
    currency: NGN
    disco: operator_supplied
    effective_from: "2026-06-01"
    effective_until: ""
    import_tariff_per_kwh: 225.0
    export_credit_per_kwh: 40.0
    export_credit_formula: operator_supplied_fixed_credit
    fixed_charges_per_month: 0.0
    interconnection_charges_per_kwh: 0.0
    source:
      type: operator_estimate
      reference: Replace with DisCo tariff order, statement, or signed product policy.
      retrieved_at: ""
    notes: Example operational estimate for development and demos; not billing truth.

  # Local advisory thresholds.
  surplus_threshold_watts: 500.0
  high_import_threshold_watts: 1000.0
  low_solar_threshold_watts: 300.0
  battery_reserve_soc: 40.0
  battery_full_soc: 90.0
  battery_reserve_margin_soc: 10.0

  # Operator-provided diesel/generator cost estimate for Tier A advice only.
  # Keep at 0 when unknown so Ori does not invent site economics.
  generator_reduce_threshold_watts: 800.0
  generator_cost_naira_per_kwh: 0.0
  grid_voltage_available_threshold: 160.0

  # Runtime fast-loop operational ledger. These are bounded estimates for
  # advice and dashboards, not DisCo settlement/billing truth.
  # Grid-unavailable hours require an explicit grid_available/grid_voltage
  # signal. Backup-supply hours are tracked separately as an inference.
  ledger_enabled: true
  ledger_max_interval_seconds: 900.0

  # Optional monthly DisCo statement supplied by product provisioning for
  # reconciliation. Empty means no settlement statement has been provided.
  settlement_statement: {}

  # Optional NERC net-billing compliance snapshot supplied by product provisioning or a
  # site operator. Empty means the site is not being tracked for net billing.
  # Ori validates and surfaces this context; it is not the regulatory source of
  # truth and does not replace DisCo/NERC/NEMSA records.
  net_billing_compliance: {}

  # Disabled when 0. If configured, this is a deterministic advisory ceiling,
  # not an inverter-control path.
  export_cap_watts: 0.0
  export_cap_warning_ratio: 0.8
  export_min_headroom_watts: 500.0
